aid: tyra
name: Tyra Biosciences
description: >-
  Tyra Biosciences is a clinical-stage biopharmaceutical company (NASDAQ: TYRA)
  based in Carlsbad, California, focused on developing next-generation precision
  medicines that address the emergence of tumor resistance and other challenges
  in existing treatment options. Tyra's proprietary in-house SNAP discovery
  platform combines advanced protein crystallography with structure-based drug
  design, producing full structural "SNAPshots" of the real-world interaction
  between a drug and its target in as little as seven days rather than weeks to
  months. This rapid, sequential structural iteration lets the team refine
  molecular designs to angstrom-level precision and design selective inhibitors
  intended to deliver deeper, more durable responses for patients, including in
  cancers where resistance mutations block first-generation drugs. Tyra was
  surfaced as a portfolio company of Canaan Partners. It is a therapeutics
  company and does not publish a public developer API, SDK, or API
  documentation surface.
